name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            phpunit: "10.5"
          - php: "8.3"
            phpunit: "11.5"
          - php: "8.4"
            phpunit: "11.5"
          - php: "8.5"
            phpunit: "12.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, phpunit:${{ matrix.phpunit }}
          coverage: none

      - name: Validate Composer package
        run: composer validate --no-check-publish

      - name: Validate XML configuration
        run: php -r "foreach (['etc/module.xml', 'etc/config.xml', 'etc/db_schema.xml', 'etc/di.xml', 'etc/payment.xml', 'etc/adminhtml/events.xml', 'etc/adminhtml/routes.xml', 'etc/adminhtml/system.xml', 'etc/frontend/di.xml', 'etc/frontend/routes.xml', 'view/frontend/layout/checkout_index_index.xml', 'phpcs.xml.dist', 'phpunit.xml.dist'] as $file) { if (simplexml_load_file($file) === false) { exit(1); } }"

      - name: Lint PHP
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Run standalone package smoke test
        run: phpunit -c phpunit.xml.dist Test/Unit/PackageManifestTest.php
