name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    name: Build Marketplace package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name || 'snapshot' }}
        run: git archive --format=zip --output="flizpay-magento2-${PACKAGE_VERSION}.zip" HEAD

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flizpay-magento2
          path: flizpay-magento2-*.zip
          if-no-files-found: error

      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload "$PACKAGE_VERSION" "flizpay-magento2-${PACKAGE_VERSION}.zip" --clobber

  package:
    # Secret-free checks that run for every PR, including forks.
    name: Package checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            phpunit: "10.5"
          - php: "8.3"
            phpunit: "11.5"
          - php: "8.4"
            phpunit: "11.5"
          - php: "8.5"
            phpunit: "12.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, phpunit:${{ matrix.phpunit }}
          coverage: none

      - name: Validate Composer package
        run: make validate

      - name: Validate XML configuration
        run: make validate-xml

      - name: Lint PHP
        run: make lint

      - name: Run standalone package smoke test
        run: phpunit -c phpunit.xml.dist Test/Unit/PackageManifestTest.php

  unit:
    # Installs Magento packages from repo.magento.com, so it needs the
    # COMPOSER_AUTH secret. Fork PRs receive no secrets and skip this job;
    # the package job still covers them.
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, sockets, xsl, zip
          tools: composer:v2
          coverage: none

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-unit-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-unit-${{ matrix.php }}-

      - name: Install the package with its Magento dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          composer init --no-interaction --name flizpay/ci-unit \
            --description "CI sandbox that installs the module with its Magento dependencies"
          composer config repositories.module path "$GITHUB_WORKSPACE"
          composer config repositories.magento composer https://repo.magento.com/
          composer config --no-plugins allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config --no-plugins allow-plugins.magento/magento-composer-installer true
          composer config --no-plugins allow-plugins.laminas/laminas-dependency-plugin true
          composer config --no-plugins allow-plugins.php-http/discovery true
          composer require --no-interaction --no-progress "flizpay/magento2:*"
          composer require --no-interaction --no-progress --dev "phpunit/phpunit:^12.0"

      - name: Run unit tests
        run: make test-unit MAGENTO_ROOT="$RUNNER_TEMP/package" MODULE_PATH=vendor/flizpay/magento2

  integration:
    # Provisions a full Magento installation, so it needs the COMPOSER_AUTH
    # secret and skips fork PRs like the unit job.
    name: Integration tests (Magento ${{ matrix.magento }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - magento: "2.4.8"
            php: "8.3"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: magento_integration_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, sockets, xsl, zip, ftp
          ini-values: memory_limit=-1
          tools: composer:v2
          coverage: none

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-integration-${{ matrix.magento }}-${{ matrix.php }}
          restore-keys: composer-integration-${{ matrix.magento }}-

      - name: Create the Magento test installation
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          composer create-project --repository-url=https://repo.magento.com/ \
            "magento/project-community-edition=${{ matrix.magento }}" \
            "$RUNNER_TEMP/magento" --no-interaction --no-progress

      - name: Install the module under app/code
        run: |
          mkdir -p "$RUNNER_TEMP/magento/app/code/FlizPay"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/magento/app/code/FlizPay/Payment"

      - name: Configure the integration test framework
        run: |
          cat > "$RUNNER_TEMP/magento/dev/tests/integration/etc/install-config-mysql.php" <<'PHP'
          <?php

          return [
              'db-host' => '127.0.0.1',
              'db-user' => 'root',
              'db-password' => 'root',
              'db-name' => 'magento_integration_tests',
              'db-prefix' => '',
              'backend-frontname' => 'backend',
              'search-engine' => 'opensearch',
              'opensearch-host' => '127.0.0.1',
              'opensearch-port' => 9200,
              'admin-user' => \Magento\TestFramework\Bootstrap::ADMIN_NAME,
              'admin-password' => \Magento\TestFramework\Bootstrap::ADMIN_PASSWORD,
              'admin-email' => \Magento\TestFramework\Bootstrap::ADMIN_EMAIL,
              'admin-firstname' => \Magento\TestFramework\Bootstrap::ADMIN_FIRSTNAME,
              'admin-lastname' => \Magento\TestFramework\Bootstrap::ADMIN_LASTNAME,
              'amqp-host' => '127.0.0.1',
              'amqp-port' => '5672',
              'amqp-user' => 'guest',
              'amqp-password' => 'guest',
              'amqp-virtualhost' => '/',
              'consumers-wait-for-messages' => '0',
          ];
          PHP

      - name: Run integration tests
        run: make test-integration MAGENTO_ROOT="$RUNNER_TEMP/magento"

      - name: Upload Magento test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-magento-${{ matrix.magento }}-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/magento/dev/tests/integration/tmp/**/var/log/**
            ${{ runner.temp }}/magento/dev/tests/integration/tmp/**/var/report/**
          if-no-files-found: ignore
